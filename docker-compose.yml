services:
  scoreboarddecoder:
    build: .
    image: scoreboarddecoder:latest
    container_name: scoreboarddecoder
    restart: unless-stopped

    # ── Linux (default) ────────────────────────────────────────────────────────
    # network_mode: host binds directly to the host network stack.
    # The container can listen on any UDP port configured in the web GUI,
    # and receives UDP broadcast packets from the scoreboard controller.
    network_mode: host

    # ── Windows / Mac Docker Desktop ──────────────────────────────────────────
    # host networking is NOT supported on Windows/Mac — it binds to the Linux VM
    # rather than the Windows host. Comment out network_mode above and uncomment
    # the ports section below instead.
    #
    # Note: UDP broadcasts (destination x.x.x.255) cannot pass through Docker's
    # port mapping NAT on Windows. For full broadcast reception, run on Linux.
    # For testing with unicast UDP, port mapping works fine.
    #
    # ports:
    #   - "8080:8080"         # Web GUI
    #   - "9100:9100"         # TCP JSON output
    #   - "21300:21300/udp"   # Daktronics default
    #   - "21301:21301/udp"
    #   - "5005:5005/udp"
    #   - "9999:9999/udp"
    #   - "4000:4000/udp"

    environment:
      - WEB_PORT=8080